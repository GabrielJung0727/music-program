name: landing

# landing/ 폴더를 GitHub Pages 로 올린다. 빌드 단계는 없다: 폴더를 그대로 싣는다.
#   1) development 에 landing/ 이 바뀐 커밋이 들어오면 자동으로 돈다.
#   2) 수동 실행:  Actions → landing → Run workflow
#
# 처음 한 번은 저장소 Settings → Pages → Build and deployment → Source 를
# "GitHub Actions" 로 바꿔 두어야 한다. 그러지 않으면 deploy 단계가 실패한다.
on:
  push:
    branches: [development]
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 올리는 도중에 새 커밋이 오면 앞의 것은 끝까지 두고 그다음 것만 잇는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing

      - id: deployment
        uses: actions/deploy-pages@v5
